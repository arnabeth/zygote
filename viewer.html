<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zygote · Arna Beth</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#c9cad0}#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:pan-y}#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:12px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:#4a4b52}.ui{position:fixed;right:clamp(14px,2.4vw,36px);bottom:clamp(14px,2.2vw,28px);display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:11px/1 'Space Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;color:#141416;user-select:none}
.ui .row{display:flex;gap:2px;align-items:center}.ui .lab{color:#4a4b52;margin-right:6px}
.ui button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:8px 6px;cursor:pointer;opacity:.55;transition:opacity .2s}
.ui button:hover{opacity:1}.ui button[aria-pressed=true]{opacity:1;text-decoration:underline;text-underline-offset:4px}
body.red .ui{color:#ececef}body.red .ui .lab{color:#9a9ba2}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<canvas id="gl" aria-label="Zygote: a chrome sculpture turning slowly in fog, a red laser point moving over it"></canvas>
<span id="load">loading</span>
<div class="ui">
 <div class="row" role="group" aria-label="Surface"><span class="lab">Surface</span><button type="button" data-m="chrome" aria-pressed="true">Chrome</button><button type="button" data-m="wax" aria-pressed="false">Wax</button><button type="button" data-m="clay" aria-pressed="false">Clay</button></div>
 <div class="row" role="group" aria-label="Light"><span class="lab">Light</span><button type="button" data-l="studio" aria-pressed="true">Studio</button><button type="button" data-l="red" aria-pressed="false">Red only</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {BokehPass} from 'three/addons/postprocessing/BokehPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const cv=document.getElementById('gl'),load=document.getElementById('load');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});}catch(e){cv.style.background='url(img/ar-torso.jpg) center/cover';load.remove();throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const BG=(new URLSearchParams(location.search).get('bg')?'#'+new URLSearchParams(location.search).get('bg'):'#c9cad0');
const scene=new THREE.Scene();scene.background=new THREE.Color(BG);scene.fog=new THREE.Fog(BG,1.3,4.2);
const pm=new THREE.PMREMGenerator(renderer);const ENV=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environment=ENV;scene.environmentIntensity=0.9;
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.01,50);cam.position.set(0,0,innerWidth<760?2.6:2.15);
// controls listen on the hero section so the page still scrolls normally
const hero=document.getElementById('gl');hero.style.cursor='grab';
const ctl=new OrbitControls(cam,hero);ctl.enableDamping=true;ctl.autoRotate=true;ctl.autoRotateSpeed=0.35;ctl.enableZoom=false;ctl.enablePan=false;
// touch: one finger scrolls the page, two fingers turn the model
ctl.touches={ONE:null,TWO:null};hero.style.touchAction='pan-y';
let tp=null;const mid=e=>({x:(e.touches[0].clientX+e.touches[1].clientX)/2,y:(e.touches[0].clientY+e.touches[1].clientY)/2});
const sph=new THREE.Spherical(),off=new THREE.Vector3();
hero.addEventListener('touchstart',e=>{tp=e.touches.length===2?mid(e):null;},{passive:true});
hero.addEventListener('touchmove',e=>{if(e.touches.length!==2||!tp)return;e.preventDefault();const m=mid(e),dx=m.x-tp.x,dy=m.y-tp.y;tp=m;
 off.copy(cam.position).sub(ctl.target);sph.setFromVector3(off);sph.theta-=2*Math.PI*dx/innerHeight;sph.phi=Math.min(Math.PI-0.1,Math.max(0.1,sph.phi-2*Math.PI*dy/innerHeight));
 off.setFromSpherical(sph);cam.position.copy(ctl.target).add(off);cam.lookAt(ctl.target);},{passive:false});
hero.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null;},{passive:true});
const hemi=new THREE.HemisphereLight('#ffffff','#bfc2c4',0.9);scene.add(hemi);
scene.add(cam);
const key=new THREE.DirectionalLight('#ffffff',1.0);key.position.set(0.4,0.7,1);cam.add(key);key.target.position.set(0,0,-1);cam.add(key.target);
const fill=new THREE.DirectionalLight('#ffffff',0.35);fill.position.set(-1,-0.3,0.6);cam.add(fill);
const laser=new THREE.Group();scene.add(laser);
const lightL=new THREE.PointLight('#ff3b4e',2.2,0.55,2);laser.add(lightL);
const dot=new THREE.Mesh(new THREE.SphereGeometry(0.006,12,12),new THREE.MeshBasicMaterial({color:'#ff2a2a'}));laser.add(dot);
const gc=document.createElement('canvas');gc.width=gc.height=128;const gx=gc.getContext('2d');
const gr=gx.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,70,90,0.9)');gr.addColorStop(0.25,'rgba(255,90,110,0.35)');gr.addColorStop(1,'rgba(255,120,140,0)');gx.fillStyle=gr;gx.fillRect(0,0,128,128);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(gc),transparent:true,depthWrite:false}));glow.scale.set(0.22,0.22,1);laser.add(glow);
const chrome=new THREE.MeshStandardMaterial({color:'#d2d3d4',metalness:1,roughness:0.33,envMapIntensity:1.15});
// wax: physical material plus a fast subsurface-scattering term, so light bleeds through thin parts
const wax=new THREE.MeshPhysicalMaterial({color:'#dcccc1',roughness:0.45,metalness:0,sheen:0.35,sheenRoughness:0.7,sheenColor:new THREE.Color('#ffffff'),clearcoat:0.25,clearcoatRoughness:0.35,envMapIntensity:0.7});
const sss={sssColor:{value:new THREE.Color('#ff8f7a')},sssDistortion:{value:0.25},sssPower:{value:2.2},sssScale:{value:1.6},sssAmbient:{value:0.03}};
wax.onBeforeCompile=sh=>{Object.assign(sh.uniforms,sss);
 sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform vec3 sssColor;uniform float sssDistortion,sssPower,sssScale,sssAmbient;')
 .replace('#include <lights_fragment_begin>',THREE.ShaderChunk.lights_fragment_begin.split('RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );').join('RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );{vec3 sh=normalize(directLight.direction+geometryNormal*sssDistortion);float sd=pow(saturate(dot(geometryViewDir,-sh)),sssPower)*sssScale;float wrap=saturate((dot(geometryNormal,directLight.direction)+0.6)/1.6);reflectedLight.directDiffuse+=(sd+sssAmbient+wrap*0.12)*sssColor*directLight.color*material.diffuseColor;}'));};
const clay=new THREE.MeshStandardMaterial({color:'#b9b9bb',roughness:0.62,metalness:0,envMapIntensity:0.5});
const MATS={chrome,wax,clay};let mesh=null;
load.textContent='loading';
fetch('zygote_1.glb').then(r=>r.arrayBuffer()).then(bin=>{
 new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).parse(bin,'',g=>{g.scene.traverse(o=>{if(o.isMesh){o.geometry.computeVertexNormals();o.material=chrome;mesh=o;}});const q0=new URLSearchParams(location.search);if(q0.get('m')&&MATS[q0.get('m')]){const b=document.querySelector('[data-m="'+q0.get('m')+'"]');b&&b.click();}
 g.scene.rotation.set(-0.26,0,Math.PI+Math.PI/4);scene.add(g.scene);load.remove();});}).catch(()=>{load.textContent='';});
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,cam));
const bokeh=new BokehPass(scene,cam,{focus:1.95,aperture:0.006,maxblur:0.012});composer.addPass(bokeh);composer.addPass(new OutputPass());
// surface + light switches
let redOnly=false;const GREY=new THREE.Color(BG),DARK=new THREE.Color('#0d0d0f');
const press=(sel,b)=>document.querySelectorAll(sel).forEach(x=>x.setAttribute('aria-pressed',x===b));
document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{press('[data-m]',b);if(mesh)mesh.material=MATS[b.dataset.m];}));
function setLight(red){redOnly=red;document.body.classList.toggle('red',red);
 scene.environment=red?null:ENV;hemi.intensity=red?0:0.9;key.intensity=red?0:1.0;fill.intensity=red?0:0.35;
 scene.background=red?DARK:GREY;scene.fog.color.copy(red?DARK:GREY);}
document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{press('[data-l]',b);setLight(b.dataset.l==='red');}));
if(new URLSearchParams(location.search).get('l')==='red')document.querySelector('[data-l="red"]').click();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);composer.setSize(innerWidth,innerHeight);});
const rnd=(a,b)=>a+Math.random()*(b-a);const STEP=1/4;let acc=0,last=0,size=1,sizeT=1,kT=1,k=1;
const tgt=new THREE.Vector3();
function far(){tgt.set(rnd(-0.6,0.6),rnd(-0.55,0.55),rnd(-0.12,0.22));}
far();laser.position.copy(tgt);
// light trail: thin segments along the path, each fading out over 1.2s
const trails=[];const trailMat=()=>new THREE.LineBasicMaterial({color:'#ff2a2a',transparent:true,opacity:.85,depthWrite:false,fog:false});
function addTrail(a,b,now){if(a.distanceToSquared(b)<1e-8||k<0.05)return;const g=new THREE.BufferGeometry().setFromPoints([a.clone(),b.clone()]);const l=new THREE.Line(g,trailMat());l.userData.t=now;scene.add(l);trails.push(l);}
function updTrails(now){for(let i=trails.length-1;i>=0;i--){const l=trails[i],age=now-l.userData.t;if(age>=1.2){scene.remove(l);l.geometry.dispose();l.material.dispose();trails.splice(i,1);}else l.material.opacity=.85*(1-age/1.2);}}
// pick a new destination a few times a second; the light glides there smoothly
function tick(){const r=Math.random();
 if(r<0.25)far();else{tgt.x+=rnd(-0.12,0.12);tgt.y+=rnd(-0.12,0.12);tgt.z+=rnd(-0.03,0.03);tgt.clampLength(0,0.8);}
 if(Math.random()<0.15)sizeT=[0.45,0.7,1,1,1.4,2.2][Math.floor(Math.random()*6)];
 kT=Math.random()<0.15?rnd(0.35,0.7):1;}
const clock=new THREE.Clock();let lastF=0;
renderer.setAnimationLoop(()=>{
 const p=0;
 if(p>=1||document.body.classList.contains('proj')){return;} // hidden: stop drawing
 const t=clock.getElapsedTime();const dt=Math.min(t-lastF,0.1);lastF=t;acc+=dt;
 while(acc>=STEP){acc-=STEP;tick();}
 const prev=laser.position.clone();
 laser.position.lerp(tgt,1-Math.exp(-dt*3.2));
 size+=(sizeT-size)*(1-Math.exp(-dt*2.5));k+=(kT-k)*(1-Math.exp(-dt*3));
 glow.scale.set(0.22*size,0.22*size,1);dot.scale.setScalar(Math.max(0.6,size));lightL.distance=(redOnly?0.85:0.55)*size;
 lightL.intensity=(redOnly?3.5:2.2)*k*size;glow.material.opacity=k;
 addTrail(prev,laser.position,t);updTrails(t);
 ctl.update();
 // sink into the fog as you scroll away
 bokeh.uniforms.focus.value=cam.position.distanceTo(ctl.target)-p*0.9;bokeh.uniforms.maxblur.value=0.012+p*0.03;
 cv.style.opacity=1-p*0.6;
 composer.render();});
</script>
</body></html>
